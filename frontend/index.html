<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Speech Analytics</title>
    <meta name="description" content="Contrastive speech analytics: where a delivery departs from an effective baseline, with the evidence." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317625e'/%3E%3Cpath d='M5.5 16h3l2.200-5.400 3 10.800 2.400-8.400 2 3h1.200' fill='none' stroke='white' stroke-width='1.700' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17.600 6.500v19' stroke='white' stroke-width='1.400' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before the first paint so there is no flash of the wrong theme.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('sa.settings.v1') || '{}');
          var pref = s.theme || 'system';
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.dataset.theme = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
          root.dataset.density = s.density || 'comfortable';
          if (s.motion === 'reduce') root.dataset.motion = 'reduce';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
