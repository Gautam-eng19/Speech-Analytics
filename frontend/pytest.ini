[pytest]
pythonpath = . backend
testpaths = tests backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Smoke tests load the real Whisper/WhisperX models (large downloads); run them explicitly with:
#   python -m pytest -m smoke
addopts = -v -m "not smoke"
markers =
    smoke: tests that load the real Whisper/WhisperX models (deselected by default)
